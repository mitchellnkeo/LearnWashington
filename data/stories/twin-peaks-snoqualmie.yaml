slug: twin-peaks-snoqualmie
title: Twin Peaks in the Snoqualmie Valley
hook: David Lynch filmed the town that was not a town — Snoqualmie, North Bend, and Fall City standing in for Twin Peaks.
body: |
  The City of Snoqualmie says Twin Peaks, the television mystery that ran
  from 1990 to 1991, and the 1992 film Fire Walk With Me, directed by
  David Lynch, were filmed in Snoqualmie and the neighboring towns of
  North Bend and Fall City. After a 25-year hiatus, the city says, the
  show returned to film in and around Snoqualmie in 2017.

  Fans still come for the landmarks. The city lists Salish Lodge & Spa as
  the Great Northern Hotel, Reinig Bridge as Ronette’s Bridge, DirtFish
  Rally School as the Twin Peaks Sheriff’s Department, Twede’s Café in
  North Bend as the Double R Diner, and the Roadhouse Restaurant & Inn in
  Fall City. Original ink drawings by Lynch are on view at Snoqualmie
  City Hall.

  The city’s Twin Peaks page is the source below. The pin sits at
  Snoqualmie Falls, the waterfall that opens the show.
