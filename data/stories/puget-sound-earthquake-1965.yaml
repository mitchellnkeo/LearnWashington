slug: puget-sound-earthquake-1965
title: 1965 Puget Sound Earthquake
hook: A magnitude 6.5 shock between Seattle and Tacoma on April 29, 1965, killed seven people.
body: |
  On April 29, 1965, a magnitude 6.5 earthquake struck between Seattle
  and Tacoma. USGS Open-File Report 94-226-B calls it the third-largest
  Washington earthquake since 1872 after 1872 and the 1949 Olympia
  shock. It caused seven fatalities and about $50 million in damage in
  1984 dollars.

  USGS Open-File Report 99-311 places the 1965 event near Tacoma at a
  depth of 60 km, inside the subducting Juan de Fuca plate. A USGS
  compilation of significant earthquakes lists the origin time as
  15:28 UTC and the epicenter as 47.32° N, 122.33° W.

  The 2001 Nisqually earthquake later compared its mechanism to this
  1965 shock and to the 1949 Olympia event. The sources below are U.S.
  Geological Survey reports.
