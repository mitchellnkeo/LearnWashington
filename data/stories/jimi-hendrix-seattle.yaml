slug: jimi-hendrix-seattle
title: Jimi Hendrix in Seattle
hook: The guitarist who rewrote rock was born in a Seattle hospital and is remembered in the neighborhood where he grew up.
body: |
  Jimi Hendrix was born Johnny Allen Hendrix at 10:15 a.m. on November 27,
  1942, at Seattle's King County Hospital. His father later renamed him James
  Marshall. He grew up in the city's Central District.

  The Library of Congress added the Jimi Hendrix Experience's 1967 debut,
  Are You Experienced, to the National Recording Registry in 2005. The
  registry essay calls it one of the quintessential statements of psychedelic
  rock and one of the most groundbreaking guitar albums of the rock era,
  including "Purple Haze," "Hey Joe," and "The Wind Cries Mary."

  Seattle Parks placed Jimi Hendrix Park next to the Northwest African
  American Museum, near where he grew up. Phase 1, designated Little Wing,
  opened in fall 2016 with a timeline of his life and career. The sources
  below are the Library of Congress registry record and the city's park page.
