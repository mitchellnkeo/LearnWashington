slug: olympia-oyster
title: Olympia Oyster
hook: Washington’s only native oyster was cut to a remnant of its old beds. WDFW and partners are putting shell, and oysters, back.
body: |
  WDFW says the Olympia oyster, Ostrea lurida, is Washington’s only
  native oyster. Adults are usually 5 to 7 centimeters long. From about
  1850 through the early 1900s, heavy harvest and conversion of natural
  beds into farms nearly wiped the species out here. By 2012, WDFW
  says as little as 5 percent of historical oyster-bed habitat
  remained.

  In 2012 WDFW named 19 priority restoration sites in Puget Sound. The
  1998 rebuilding plan was not funded as a WDFW project, so much of
  the field work has been done with the Puget Sound Restoration Fund
  and other partners. WDFW says those partners reached a 10-year goal
  of restoring 100 acres of Olympia oyster habitat by 2020. The
  oysters brood larvae inside the shell for 10 to 12 days, a trait
  WDFW links to some resilience to ocean acidification.

  WDFW photographs recovering beds at Discovery Bay. This pin is that
  bay. The sources below are Washington Department of Fish and
  Wildlife pages.
