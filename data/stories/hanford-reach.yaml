claims:
  - text: >
      FWS says the monument comprises over 196,000 acres and was the
      first national monument for the Fish and Wildlife Service,
      proclaimed in 2000 under the Antiquities Act. It includes 46.5
      miles of the 51-mile Hanford Reach, fall Chinook spawning areas,
      and sturgeon.
    claimType: factual
    confidence: verified
    sources:
      - fws-hanford-about
  - text: >
      In 1943 the Army Corps of Engineers selected a site near the desert
      towns of White Bluffs and Hanford for secret plutonium production.
      Safety and security buffer lands around the reactors remained
      largely undisturbed and later became the monument.
    claimType: historical
    confidence: verified
    sources:
      - fws-hanford-about
  - text: >
      The proclamation protects shrub-steppe birds including loggerhead
      shrikes, sage sparrows, sage thrashers, and ferruginous hawks;
      rare plants including Umtanum desert buckwheat and White Bluffs
      bladderpod; the White Bluffs and Hanford Dune Field; and
      archaeological and historic artifacts from more than 10,000 years
      of human occupation. Visitors may currently access over 57,000
      acres.
    claimType: factual
