slug: sleepless-in-seattle
title: Sleepless in Seattle
hook: Tom Hanks’s floating bachelor pad is a real Lake Union home. Visit Seattle says the insides were a soundstage — look from the water, not the dock.
body: |
  Visit Seattle, marking the 1993 rom-com’s 30th anniversary, says Sam’s
  house — Tom Hanks’s floating bachelor pad — sits on Lake Union. The
  home is privately owned. The city’s tourism page says a tour from the
  water is the way to glimpse it, and that the interior shots were filmed
  on a soundstage.

  The same Visit Seattle page walks other Seattle stops. On New Year’s
  Eve in the film, Sam watches fireworks from his balcony across the lake
  at Gas Works Park. Jay, played by Rob Reiner, assesses Sam’s dating
  prospects outside the Inn at the Market, then the two eat at the
  Athenian inside Pike Place Market, where the page says a plaque marks
  the seat. Annie later watches Sam and Jonah at Alki Beach from across
  the street.

  The Seattle Times, in 2010, said tourists were still slipping onto
  Lake Union docks looking for the house seventeen years after the
  movie. Please don’t. The pin is the lake, not someone’s front door.
