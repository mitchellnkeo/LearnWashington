slug: grand-coulee
title: Grand Coulee
hook: A dry canyon about 50 miles long holds the geologic story of a river that lost its channel — until people flooded part of it as Banks Lake.
body: |
  Grand Coulee is a National Natural Landmark on the Ice Age Floods
  trail. NPS says this geologic feature is approximately 81 kilometers
  (50 miles) long. From Dry Falls State Park, about 5 miles southwest
  of Coulee City, visitors can see much of the evidence.

  The landmark page walks through a series of events: the ancestral
  Columbia flowed through a low range of granite mountains; lava built
  the Columbia Plateau and diverted the river; ice advanced and
  receded; a new course was cut; waterfalls formed and retreated; and
  the Columbia returned to its present channel, leaving the Coulee high
  and dry until part of it was turned into a reservoir by damming.

  That reservoir is Banks Lake, behind Dry Falls Dam, fed from Grand
  Coulee Dam. This card is the canyon. The dam and the lake are
  separate cards. The source below is the National Park Service
  landmark page.
