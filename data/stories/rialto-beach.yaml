slug: rialto-beach
title: Rialto Beach
hook: Drift logs, seastacks, and a 1.5-mile walk to Hole-in-the-Wall define this Olympic wilderness beach 75 miles from Port Angeles.
body: |
  Rocky beaches, giant drift logs, pounding waves, and offshore seastacks
  define Rialto Beach. Mora, just inland, is old-growth forest with the
  sound of the Pacific. NPS places Rialto about 36 miles southwest of
  Lake Crescent and about 75 miles from Port Angeles, at the end of Mora
  Road off La Push Road.

  The 94-site Mora Campground is about three miles from the beach.
  Hole-in-the-Wall is a sea-carved arch about 1.5 miles north of Rialto,
  in the Olympic wilderness. The Quillayute River blocks travel from
  Rialto to First, Second, and Third Beaches. First Beach is on the
  Quileute Indian Reservation; Second and Third Beaches, just south, are
  in Olympic National Park on the wilderness coast.

  Tides can close the beach. NPS warns that some headlands cannot be
  rounded even on the lowest tides and that overland trails are required.
  Pets on leash are allowed 0.8 mile north to Ellen Creek during daylight
  hours; camping with pets is prohibited. The sources below are Olympic
  National Park pages.
