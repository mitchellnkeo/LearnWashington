slug: american-camp
title: American Camp
hook: Lieutenant Colonel Silas Casey sited the U.S. camp in 1859 outside British naval range — for a Pig War that was never fought.
body: |
  The American Camp parade ground on San Juan Island was chosen by
  Lieutenant Colonel Silas Casey. NPS says he arrived in 1859 with
  reinforcements for the imminent — but never fought — Pig War. The
  site sat outside the range of British naval artillery, had abundant
  water, and offered some protection from the weather.

  Compared with English Camp, American Camp was utilitarian. At its
  peak it had a telegraph station, schoolhouse, infirmary, and
  blockhouse. Two of the three surviving structures were relocated
  after the park was created. Visitors can still see the original
  officers' quarters, the Redoubt, and the Laundress Quarters.

  San Juan Island National Historical Park covers 2,141 acres in two
  units. Of roughly 700 acres of American Camp prairie grassland, NPS
  says only about 30 acres can be considered true native prairie — some
  of the last surviving native prairie in Washington, about 3 percent
  of its original extent. The sources below are park pages.
