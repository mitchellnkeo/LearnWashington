slug: pacific-razor-clams
title: Pacific Razor Clams
hook: WDFW has managed Washington’s coastal razor-clam digs since 1929, counting every beach before anyone is allowed to shovel.
body: |
  WDFW says Washington has actively managed the coastal recreational
  razor-clam fishery since 1929. Pacific razor clams live mainly on
  intertidal ocean beaches from about a +3-foot tide to a −2-foot tide.
  The state divides harvest into five management beaches: Long Beach,
  Twin Harbors, Copalis, Mocrocks, and Kalaloch.

  Each summer, biologists estimate clams under 3 inches (pre-recruits)
  and 3 inches or longer (recruits). A total allowable catch then uses
  a 30 to 40 percent harvest rate on recruit-sized clams, except at
  Kalaloch, where the rate is fixed at 25.4 percent. North of Grays
  Harbor, WDFW co-manages Copalis, Mocrocks, and Kalaloch with coastal
  tribes, including the Quinault Indian Nation, and splits that catch
  50/50. No beach opens until the Department of Health clears marine
  toxin tests, especially for domoic acid.

  This pin is Copalis Beach, the reach from the north jetty of Grays
  Harbor to the Copalis River. The sources below are Washington
  Department of Fish and Wildlife and USGS pages.
