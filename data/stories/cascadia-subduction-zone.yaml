slug: cascadia-subduction-zone
title: Cascadia Subduction Zone
hook: A quiet plate boundary runs from California to British Columbia — and under Washington.
body: |
  The Cascadia subduction zone is a 1,300-kilometer tectonic boundary. Offshore,
  the Juan de Fuca and Gorda plates converge with North America and slide
  beneath the continent. USGS maps the zone from northern California to
  southern British Columbia, from well offshore into eastern Washington and
  Oregon.

  The interface is a megathrust fault. Stress builds there until the fault
  slips. Subduction-zone earthquakes are the largest on Earth and can exceed
  magnitude 9. They are also known to generate large tsunamis.

  Cascadia is unusual among textbook subduction zones for its extraordinarily
  low instrumentally recorded earthquake rates. Seven of its volcanoes have
  erupted since the start of the 18th century. The sources below are the public
  USGS record of the plate boundary and its marine geohazards.
