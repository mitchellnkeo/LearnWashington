slug: northern-exposure-roslyn
title: Northern Exposure in Roslyn
hook: Cicely, Alaska, was a former coal town in the Cascades. Some bar interiors were shot in Redmond.
body: |
  The Roslyn Historical Museum says the 1990–1995 television series
  Northern Exposure used the former coal town because its early-1900s
  architecture and heavy snow looked like a remote Alaskan village, and
  because Roslyn was close enough to Seattle for studio interiors. Some
  inside shots — including the Brick Tavern and Dr. Fleischman’s home —
  were filmed at a studio in Redmond. Lake Cle Elum and the Easton
  airport were filming sites as well.

  The museum says the Roslyn Café mural predated the series; producers
  added the apostrophe-s to make it fit Cicely. The Advisory Council on
  Historic Preservation notes that the Roslyn Museum also preserves items
  from the show, which was filmed in town.

  The pin is Roslyn, still smaller than its fictional Alaskan twin on a
  good tourist Saturday.
