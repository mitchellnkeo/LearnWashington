slug: sunrise-mount-rainier
title: Sunrise
hook: At 6,400 feet, this is the highest place a car can reach in Mount Rainier National Park, and it looks straight at Emmons Glacier.
body: |
  Sunrise, on the east side of Mount Rainier, is the highest point that
  can be reached by vehicle in the park: 6,400 feet. In summer the
  subalpine meadows fill with wildflowers. On clear days the view takes
  in Mount Rainier and Emmons Glacier. Sunrise Point offers nearly
  360-degree views of the surrounding valleys, Rainier, and other
  Cascade volcanoes including Mount Adams.

  Those views and the trail system make Sunrise the second most visited
  location in the park. It is 60 miles northeast of the Nisqually
  Entrance and 14 miles northwest of the Sunrise / White River turnoff
  on State Route 410. The Sunrise Road usually opens in late June or
  early July and closes in late September to early October.

  The meadows around Sunrise are known collectively as Yakima Park.
  NPS says that during the summers this area was a favorite of the
  Yakama people for hunting and gathering, and that for thousands of
  years these subalpine meadows have been important to Indigenous
  people for their plant and animal resources. The source below is the
  Mount Rainier National Park Sunrise page.
