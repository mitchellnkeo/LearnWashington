slug: island-marble-butterfly
title: Island Marble Butterfly
hook: Thought extinct since 1908, this fuzzy green-and-white butterfly turned up at American Camp in 1998 — and is now federally endangered.
body: |
  The island marble butterfly (Euchloe ausonides insulanus) was believed
  extinct after 1908, when the last known specimens came from Vancouver
  and Gabriola islands in British Columbia. In 1998 it was rediscovered
  during a prairie butterfly survey at American Camp on San Juan Island.

  NPS calls it one of the rarest butterflies in North America. Adults
  look fuzzy, with marbled green, yellow, white, and black wings that
  span less than 2 inches. Today the few hundred remaining animals
  inhabit a small area on San Juan Island. They have been extirpated
  from Lopez Island.

  The U.S. Fish and Wildlife Service listed the butterfly as endangered
  in 2020. Critical habitat covers about 812 acres, 744 of them at
  American Camp. NPS biologists collect 100 to 300 eggs and caterpillars
  each spring. About 80 to 90 percent survive in the rearing lab,
  compared with about 5 percent of eggs in the wild. The sources below
  are San Juan Island National Historical Park pages.
