slug: north-cascades-national-park-1968
title: North Cascades National Park, 1968
hook: President Johnson signed Public Law 90-544 on October 2, 1968, creating a national park and two recreation areas for "majestic mountain scenery."
body: |
  On October 2, 1968, President Lyndon B. Johnson signed Public Law
  90-544 (82 Stat. 926). The act established North Cascades National
  Park, Ross Lake National Recreation Area, and Lake Chelan National
  Recreation Area. It also created the Pasayten Wilderness and modified
  the Glacier Peak Wilderness.

  NPS quotes the purpose as protecting majestic mountain scenery. The
  enabling record lists 276,928 hectares, or 684,305 acres, for the
  complex. This card is the establishment story. The glacier and
  landscape card is a separate story.

  The photograph is Cascade Pass and Pelton Basin, the high country the
  1968 act was written to keep. The sources below are the National Park
  Service record of the enabling act.
