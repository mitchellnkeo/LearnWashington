slug: ice-age-floods
title: Ice Age Floods
hook: NPS says that 18,000 to 15,000 years ago an ice dam in northern Idaho failed, sending Glacial Lake Missoula across Washington and down the Columbia.
body: |
  The Ice Age Floods National Geologic Trail follows the path of the
  Missoula Floods. NPS says that 18,000 to 15,000 years ago an ice dam
  in northern Idaho created Glacial Lake Missoula, stretching 3,000
  square miles around Missoula, Montana. The dam burst. Floodwaters
  crossed Washington, ran down the Columbia into Oregon, and reached
  the Pacific.

  In the 1920s, J Harlen Bretz argued that a catastrophic flood carved
  the Channeled Scabland. Joseph Pardee of the U.S. Geological Survey
  later pointed to Glacial Lake Missoula as the source. NPS says the
  idea was not generally accepted until the late 1970s.

  This card is the trail and the floods. Dry Falls, Drumheller Channels,
  and Palouse Falls are the place cards. The sources below are the
  National Park Service Ice Age Floods pages.
