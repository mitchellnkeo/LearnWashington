claims:
  - text: >
      A City of Seattle historic-resources survey says James A. Moore
      filed the plat for the Brooklyn Addition in 1890, that David
      Denny built the Latona Bridge in 1891 for streetcar service to
      Brooklyn, and that in 1892 the line was extended north along
      Columbus Avenue, now University Way.
    claimType: historical
    confidence: verified
    sources:
      - seattle-university-park-survey
  - text: >
      A City of Seattle planning report says that in 1891 the first
      settlers in the area voted to incorporate Brooklyn into Seattle,
      and that the University of Washington was then relocated from
      downtown to the Brownfield farm.
    claimType: historical
    confidence: verified
    sources:
      - seattle-udistrict-existing
  - text: >
      The city survey says that in the fall of 1895 the University of
      Washington moved to its present campus with 310 students, that
      the University Store opened at 42nd and Columbus the same year,
      and that the streetcar stop at 42nd and Brooklyn Avenue soon
      became known as University Station.
    claimType: historical
    confidence: verified
    sources:
      - seattle-university-park-survey
  - text: >
      The city survey says university enrollment reached 614 by 1900
      and 2,200 by 1910, that the 1900 Census counted more than 400
      people in the Brooklyn Addition, and that by 1910 the University
      District contained the greatest concentration of commercial
      buildings outside of downtown.
    claimType: historical
    confidence: verified
    sources:
      - seattle-university-park-survey
  - text: >
      The city survey says the University Bridge opened in 1919 and
      established 10th Avenue NE, now Roosevelt Way, as the major
      north-south arterial.
    claimType: factual
    confidence: verified
    sources:
      - seattle-university-park-survey
  - text: >
      USGS Geographic Names lists University District, a populated
      place in King County, at 47.6602778° N, 122.3116667° W
      (GNIS 2363534).
    claimType: factual
    confidence: verified
    sources:
