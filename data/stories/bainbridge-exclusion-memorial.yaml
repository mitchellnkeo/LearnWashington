slug: bainbridge-exclusion-memorial
title: Bainbridge Island Japanese American Exclusion Memorial
hook: On March 30, 1942, 227 Bainbridge Islanders were the first Japanese Americans taken under Executive Order 9066. A wall at Eagledale dock now names 276 people.
body: |
  The Bainbridge Island Japanese American Exclusion Memorial stands at
  4192 Eagle Harbor Drive, at the old Eagledale ferry dock. President
  Franklin Roosevelt signed Executive Order 9066 on February 19, 1942.
  NPS says that on March 30, 1942, 227 people of Japanese ancestry
  gathered at the dock. They were sent first to Manzanar, then many to
  Minidoka. Over half returned.

  NPS says they were the first of more than 110,000 people of Japanese
  ancestry removed from the West Coast, two-thirds of them U.S. citizens,
  and that the exclusion ultimately involved over 125,000 people. A wall
  at the memorial names 276. The Japanese phrase on the site is Nidoto
  Nai Yoni — "Let it not happen again." The memorial is a unit of
  Minidoka National Historic Site.

  The sources below are the National Park Service place page for the
  memorial.
