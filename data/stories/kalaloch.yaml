slug: kalaloch
title: Kalaloch
hook: One of the most visited stretches of Olympic National Park sits right on Highway 101, with seven beach trails and a year-round campground on the bluff.
body: |
  Kalaloch is on the southwest coast of the Olympic Peninsula, reachable
  directly from Highway 101. NPS calls it one of the most visited areas
  of Olympic National Park. A ranger station is open in summer. Trails
  from the lodge and campground lead to a sandy beach below a bluff.

  Seven trails lead to the ocean from Highway 101. Beach 4 is an
  excellent tidepooling spot for seastars and anemones at low tide.
  Beach 1 has spruce burls. Ruby Beach and Beach Trail 4 have accessible
  viewpoints. When hiking the coast, NPS says, always check the tides;
  some stretches become impassable at high water.

  Kalaloch Campground is open year-round. South Beach Campground, just
  south of Kalaloch, is open in summer. Pets are allowed on Kalaloch
  area beaches if they stay on a leash. North of this coast, the Hoh
  River is a natural boundary. The sources below are Olympic National
  Park pages.
