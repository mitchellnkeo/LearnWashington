slug: ten-things-stadium-high
title: 10 Things I Hate About You
hook: Padua High was Stadium High. Heath Ledger’s Shakespeare rewrite pretended the brick castle in Tacoma was a Seattle school.
body: |
  The Seattle Times says Stadium High School in Tacoma was cast as Padua
  High in the 1999 Heath Ledger Shakespeare-inspired teen romance 10 Things
  I Hate About You, even though the movie is nominally set in Seattle.

  The same Times piece says the building began as a French-château luxury
  hotel in 1891, became Tacoma High School in 1906, gained Stadium Bowl in
  1910, and took its present name in 1913. An interior remodel from 2004 to
  2006 turned the cafeteria featured in the film into a library.

  It is still a public high school. The Times notes that Pretty Gritty
  Tours sometimes walks the halls when students are gone. The pin is the
  castle above Commencement Bay, not a Seattle soundstage.
