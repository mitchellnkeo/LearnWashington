slug: mount-rainier-glaciers
title: Mount Rainier Glaciers
hook: Twenty-eight major glaciers cover about 30 square miles of the mountain. Emmons is the largest in the Lower 48; Carbon ends the lowest.
body: |
  Mount Rainier holds 28 major glaciers and numerous unnamed snow or ice
  patches, covering about 30 square miles (78 km²). They feed five major
  river systems and are, NPS says, important indicators of climatic
  change.

  The Emmons Glacier has the largest area of any glacier in the
  contiguous 48 states: 4.3 square miles. The Carbon Glacier has the
  lowest terminus altitude, 3,600 feet. A 1963 rockslide off Little
  Tahoma covers part of Emmons and, NPS says, insulates the ice and
  slows its melt. The glacier also fills part of the scar of a collapse
  on the northeast side of the mountain about 5,600 years ago.

  Glacial outburst floods have sent debris flows down park valleys. A
  flood from the South Tahoma Glacier created a debris flow along
  Tahoma Creek on August 13, 2015. The sources below are Mount Rainier
  National Park glacier and Sunrise geology pages.
