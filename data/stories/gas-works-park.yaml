  - text: >
      The same city briefing says the park opened to the public in 1975,
      was nominated to the National Register of Historic Places in 2002
      and listed in 2013, and became a City of Seattle landmark.
    claimType: factual
    confidence: verified
    sources:
      - seattle-gas-works-landmarks
  - text: >
      Seattle Parks says access to Lake Union is restricted at Gas
