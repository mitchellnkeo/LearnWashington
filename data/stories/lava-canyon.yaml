slug: lava-canyon
title: Lava Canyon
hook: A mudflow-scoured canyon on the southeast side of Mount St. Helens drops a waterfall over ancient lava, with a trail that the Forest Service warns is not for going off-trail.
body: |
  Lava Canyon Interpretive Site sits in Gifford Pinchot National Forest on
  the southeast side of Mount St. Helens. The Forest Service lists the
  site at 46.165998° N, 122.087105° W, elevation 3,000 feet. A mudflow
  scoured the canyon. A waterfall now drops over ancient lava.

  Trail 184 is the interpretive route. The Forest Service warns of
  fatalities off-trail. A five-dollar vehicle fee or a valid pass is
  required. The site is in the Skamania, Lewis, and Cowlitz county area.

  The canyon is one of the places where the 1980 eruption's aftermath is
  still easy to see in rock and water. The source below is the Forest
  Service page for the interpretive site.
