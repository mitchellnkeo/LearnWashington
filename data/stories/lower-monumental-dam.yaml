slug: lower-monumental-dam
title: Lower Monumental Dam
hook: The second Lower Snake dam is 3,791 feet long at river mile 41.6 near Kahlotus. Lake West runs 28 miles up to Little Goose.
body: |
  Lower Monumental Lock and Dam was the second of four dams in the Lower
  Snake River Project, authorized in the Rivers and Harbors Act of 1945.
  Construction began in 1961. Three turbine units were operating in 1970.
  Three more came online in 1978.

  The dam stands at Snake River mile 41.6 near Kahlotus. The Corps lists
  it as 3,791 feet long. Six 135-megawatt units total 810 megawatts. The
  project includes a powerhouse, spillway, navigation lock, and fish
  passage.

  Lake Herbert G. West extends 28 miles upstream to Little Goose Dam.
  Authorized purposes are hydropower and navigation, with recreation,
  fish and wildlife, water quality, and irrigation as other purposes.
  The source below is the Corps Northwestern Division fact sheet.
