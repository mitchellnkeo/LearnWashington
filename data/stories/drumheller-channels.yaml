slug: drumheller-channels
title: Drumheller Channels
hook: A cascade of buttes and basins west of Othello is the Ice Age Floods landscape the National Park Service calls the most spectacular of its kind.
body: |
  Drumheller Channels National Natural Landmark sits on Columbia National
  Wildlife Refuge land along West McManamon Road in Othello. NPS designated
  the landmark in 1986. The agency describes a cascade of channels eight to
  twelve miles wide, with about 150 channels and more than 180 rock basins.

  The National Park Service calls this the most spectacular butte-and-basin
  scabland in the Ice Age Floods country. Floodwaters scoured the basalt
  into a maze of coulees, buttes, and closed basins that still hold water
  today. The landmark is one of the places NPS uses to explain the Missoula
  Floods on the Ice Age Floods National Geologic Trail.

  Visitors reach the channels from the refuge roads west of Othello. The
  sources below are the National Park Service record of the landmark and
  the Ice Age Floods trail.
