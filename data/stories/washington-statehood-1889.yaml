slug: washington-statehood-1889
title: Washington Statehood, 1889
hook: President Harrison admitted Washington as the 42nd state on November 11, 1889, the only state named for a president.
body: |
  On November 11, 1889, President Benjamin Harrison admitted Washington
  as the 42nd state. The Library of Congress notes that voters had
  rejected earlier constitutions between 1878 and 1889. Washington
  entered the Union in the same season as Montana and the Dakotas.

  The Library of Congress also notes that Washington is the only state
  named after a president. A Columbia name was considered and set aside.
  Olympia became the capital.

  The photograph is the first page of the 1889 state constitution. The
  sources below are the Library of Congress Today in History page and
  the statehood guide.
