slug: olympic-coast-national-marine-sanctuary
title: Olympic Coast National Marine Sanctuary
hook: NOAA designated 3,188 square miles of ocean off the Olympic Peninsula on July 22, 1994, from the beaches out across the continental shelf.
body: |
  NOAA designated Olympic Coast National Marine Sanctuary on July 22,
  1994. The sanctuary covers 3,188 square miles of marine waters off the
  Olympic Peninsula. It extends about 25 to 45 miles seaward, covering
  much of the continental shelf and several major submarine canyons.

  NOAA says the sanctuary protects a productive upwelling zone, kelp and
  intertidal communities, and deep-sea coral and sponge habitats. The
  contemporary cultures of the Hoh Tribe, Makah Tribe, Quileute Tribe,
  and Quinault Indian Nation have forged inseparable ties to the ocean
  environment.

  The sanctuary is the offshore counterpart to Olympic National Park's
  coast. The source below is NOAA's official sanctuary about page.
