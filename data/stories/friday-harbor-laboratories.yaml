slug: friday-harbor-laboratories
title: Friday Harbor Laboratories
hook: UW’s marine station on San Juan Island has run since 1903, on a 490-acre biological preserve in some of the richest cold water on the coast.
body: |
  The University of Washington lists Friday Harbor Laboratories as its
  marine field station, started in 1903, in the College of the
  Environment. UW says the station sits at the water’s edge on San Juan
  Island and draws researchers from around the world to work from
  genomes to ecosystems. Long-running strengths include comparative
  biomechanics, developmental biology, neurophysiology, genomics, and
  marine ecology.

  FHL’s own about page describes 490 acres of land, plus marine waters,
  held as biological preserves. The lab also manages preserves at False
  Bay and Argyle Lagoon on San Juan Island and at Point George and
  Cedar Rock on Shaw Island. A tidal range of about three meters
  exposes rock, sand, and mud. Collecting can reach depths of 300
  meters. The waters are relatively free from pollution, with swift
  tideways and quiet bays.

  The street address is 620 University Road, Friday Harbor. This pin is
  the town of Friday Harbor. The sources below are University of
  Washington pages.
