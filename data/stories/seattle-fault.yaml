slug: seattle-fault
title: Seattle Fault
hook: A roughly 70-kilometer thrust under Seattle can host a magnitude 7 to 7.5 earthquake. USGS says the last large one was close to the year 900.
body: |
  The Seattle fault is a north-directed thrust that runs under the city.
  USGS describes a zone about 70 kilometers long. The agency says the
  fault can host a magnitude 7 to 7.5 earthquake. High-resolution marine
  seismic imaging has mapped the zone under Puget Sound.

  The most recent large earthquake on the Seattle fault occurred close to
  the year 900. Other USGS work dates that event to about A.D. 900–930
  from uplifted shorelines and tsunami deposits. That is the last large
  rupture USGS cites for the fault.

  The Seattle Field Office places the fault among the crustal sources that
  can shake the Puget Lowland hard, separate from the deeper Cascadia
  megathrust. The sources below are the public USGS record of the fault
  and the marine seismic study.
