slug: ross-lake
title: Ross Lake
hook: A long reservoir behind Ross Dam fills the Skagit valley inside Ross Lake National Recreation Area, one of three lakes made by Seattle City Light.
body: |
  Ross Lake sits on the Skagit River in Whatcom County, inside Ross Lake
  National Recreation Area. The park foundation document lists that unit
  at 116,798 acres. NPS boat-in camping pages treat the lake as a
  reservoir reached from the water, not from a lakeshore highway.

  NPS says Ross, Diablo, and Gorge lakes were created by dams of the
  Skagit Hydroelectric Project, operated by Seattle City Light. Diablo
  Lake, just downstream, is the turquoise reservoir most visitors see
  from State Route 20. Ross Lake itself stretches north toward the
  Canadian border.

  The recreation area is the developed corridor through the North Cascades
  complex. The sources below are the National Park Service record of the
  lake, the foundation document, and the Diablo Lake page.
