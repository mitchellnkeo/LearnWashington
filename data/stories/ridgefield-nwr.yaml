slug: ridgefield-nwr
title: Ridgefield National Wildlife Refuge
hook: FWS established this lower Columbia refuge in 1965 as wintering habitat for the dusky Canada goose, whose range is extremely limited.
body: |
  Ridgefield National Wildlife Refuge sits just north of Vancouver,
  between the Columbia River and the town of Ridgefield in Clark County.
  FWS established the refuge in 1965 to provide wintering habitat for
  the dusky subspecies of the Canada goose, whose habitat is extremely
  limited. Smaller parcels have been added since.

  FWS describes about 5,300 acres of wetlands, grasslands, and riparian
  forests. Staff and partners also work on Oregon oak woodlands. The
  lands support wintering dusky Canada geese, migrating waterfowl, and
  species such as Columbian white-tailed deer and sandhill cranes.

  The refuge is one of four in the Ridgefield complex along the lower
  Columbia. The sources below are the U.S. Fish and Wildlife Service
  refuge pages.
