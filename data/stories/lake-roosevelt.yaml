slug: lake-roosevelt
title: Lake Roosevelt
hook: The reservoir behind Grand Coulee Dam is officially Franklin D. Roosevelt Lake, a long pool NPS says is the largest reservoir in the Pacific Northwest.
body: |
  Lake Roosevelt National Recreation Area follows the reservoir behind
  Grand Coulee Dam. NPS calls the water body Franklin D. Roosevelt Lake.
  The park brochure says it is the largest reservoir in the Pacific
  Northwest and stretches 133 miles from Grand Coulee Dam to Onion Creek,
  16 miles south of the United States–Canada border.

  NPS says the park manages more than 300 miles of publicly accessible
  shoreline. Dam construction began in 1933 and finished in 1941. In 1946
  the Secretary of the Interior approved a three-party agreement among
  the Bureau of Reclamation, the Office of Indian Affairs, and the
  National Park Service.

  The recreation area is a water park first: boating, fishing, camping,
  and swimming along a narrow, fluctuating pool. The sources below are
  the National Park Service Lake Roosevelt pages.
