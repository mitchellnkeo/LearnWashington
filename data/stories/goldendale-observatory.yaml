slug: goldendale-observatory
title: Goldendale Observatory
hook: A state-park observatory in the hills above the Columbia that Parks says houses one of the nation’s largest public telescopes.
body: |
  Washington State Parks lists Goldendale Observatory State Park
  Heritage Site at 1602 Observatory Drive, Goldendale. Parks says the
  observatory sits in the hills above the Columbia River and houses one
  of the nation’s largest public telescopes. The official park page
  prints the site at 45.83868027° N, 120.8151398° W.

  Parks is known here for science programs and dark skies. Afternoon
  programs use filtered telescopes to look at the Sun. Evening programs
  show planets, star clusters, nebulae, and galaxies when weather
  allows. Reservations are required to enter the visitor center and
  observatory. The grounds may be walked without a show booking.

  This card uses the Parks description of the telescope and programs.
  It does not add an opening year that Parks does not print on the park
  page. The source below is Washington State Parks.
