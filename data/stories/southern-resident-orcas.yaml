slug: southern-resident-orcas
title: Southern Resident killer whales
hook: Three family pods still spend summers in Puget Sound. There are only a few dozen left.
body: |
  Southern Resident killer whales are a distinct population of orcas that range
  from central California to southeast Alaska. NOAA Fisheries listed them as
  endangered under the Endangered Species Act on November 18, 2005. They are
  also considered depleted under the Marine Mammal Protection Act.

  The population is three family groups — J, K, and L pods. They spend several
  months of summer and fall in Washington's Puget Sound. A 1974 count, the
  first year individuals were tallied after captures for marine parks, recorded
  71 whales. The population peaked at 97 in 1996. The 2024 census numbered 73.

  Inland waters of Washington were designated critical habitat in 2006. In
  2021 NOAA expanded that designation to include coastal waters off Washington,
  Oregon, and California. The sources below are NOAA Fisheries' public listing
  and stock-assessment record.
