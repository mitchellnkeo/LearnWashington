slug: artist-point
title: Artist Point
hook: State Route 542 climbs to 5,140 feet and ends at Artist Point, with views of Mount Baker and Mount Shuksan.
body: |
  The Mt. Baker Highway, State Route 542, is a designated scenic byway.
  The U.S. Forest Service says the road begins at Interstate 5 in
  Bellingham, follows the North Fork Nooksack River, climbs to 5,140
  feet, and ends at Artist Point. The viewpoint is known for sweeping
  views of Mount Baker and Mount Shuksan. Heather Meadows sits near
  the end of the byway.

  Artist Point is about 24 miles east of the Glacier Public Service
  Center. Vehicle access is seasonal. The Forest Service says the
  trailhead is typically inaccessible by car from November through
  June.

  Artist Ridge Trail 669 starts at the parking lot. A universally
  accessible paved path leads 100 yards to an overlook with benches.
  On clear days the Forest Service says mountain views, dominated by
  Mount Baker and Mount Shuksan, stretch from Canada to Mount Rainier.
  A valid recreation pass is required at the trailhead. The sources
  below are U.S. Forest Service pages.
