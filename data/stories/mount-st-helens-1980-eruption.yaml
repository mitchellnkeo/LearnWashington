slug: mount-st-helens-1980-eruption
title: Mount St. Helens
hook: On a clear May morning, the north side of the mountain gave way.
body: |
  Before 1980, Mount St. Helens rose as a steep, symmetrical cone in the
  southern Cascades of Skamania County. That shape ended on May 18.

  At 8:32 a.m. Pacific Daylight Time, a magnitude 5.1 earthquake accompanied
  the collapse of the volcano's bulging north flank. The landslide was the
  largest debris avalanche on Earth in recorded history. Most of it turned
  west down the North Fork Toutle River for about 14 miles.

  Removal of that flank released pressure inside the volcano. A lateral blast
  roared north through what had been dense forest, and a Plinian eruption
  then ran for about nine hours. The debris avalanche took the upper 1,300
  feet of the summit and left a horseshoe-shaped crater.

  Ash blew east across Washington. Spokane, about 250 miles away, went dark
  in daytime. The mountain is still there — lower, open to the north, and
  one of five Washington volcanoes the state lists as high or very high
  threat. The sources below are the public USGS and Washington Geological
  Survey record of what happened.
