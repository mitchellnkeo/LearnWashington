slug: sequim-rain-shadow
title: Sequim Rain Shadow
hook: Sequim gets about 16 inches of rain a year — less than 35 miles from temperate rain forest, and close enough for prickly pear cactus.
body: |
  Storms from the Pacific hit the Olympic Mountains and drop their
  moisture on the west side. NPS says the northeastern Olympic Peninsula
  then sits in a dry rain shadow. The town of Sequim gets roughly 16
  inches (41 cm) of rain a year. A park rainfall table lists Sequim at
  15.80 inches (40 cm) for the year, Port Angeles at 25.9, Kalaloch at
  103, and the Hoh at 135.

  Farmers irrigate their fields. A few prickly pear cactus plants grow
  there, less than 35 miles (56 km) from lush temperate rain forests.
  Hurricane Ridge, still wringing moisture from the same storms, averages
  30 to 35 feet (10 m) of snow a year.

  The west-side valleys are the wettest spots in the continental United
  States. The Hoh records an average of almost 12 feet (3.6 meters) of
  rain a year. The sources below are Olympic National Park weather pages.
