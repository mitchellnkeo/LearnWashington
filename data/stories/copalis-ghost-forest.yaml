slug: copalis-ghost-forest
title: Copalis Ghost Forest
hook: Western red cedars at the Copalis River died between the 1699 and 1700 growing seasons — killed when Cascadia dropped the coast.
body: |
  A dead forest of western red cedar stands in a brackish tidal marsh
  on the Copalis River. USGS says the trees were killed by rapid
  subsidence during the most recent Cascadia megathrust earthquake.
  Tree rings show they died sometime after the end of the A.D. 1699
  growing season and before the beginning of the A.D. 1700 growing
  season.

  That timing matches a tsunami recorded in Japanese historical
  records. USGS Fact Sheet 2025-3050 dates the last great Cascadia
  earthquake to January 26, 1700, with an estimated magnitude between
  8.7 and 9.2. Living forest behind the snags stands above the highest
  tides.

  The photograph below is by Brian Atwater of the U.S. Geological
  Survey. The sources below are USGS pages.
