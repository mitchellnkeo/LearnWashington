slug: twilight-forks
title: Twilight in Forks
hook: The vampires are fictional. The town is real. Almost none of the first movie was shot here — and visitors came anyway.
body: |
  The Forks Chamber of Commerce still calls Forks home of the Twilight
  Saga. It invites fans to photograph Bella’s trucks, pick up a
  self-guided Twilight map, and see costumes and props from the films,
  free, at the Rainforest Arts Center. The chamber’s Forever Twilight in
  Forks Festival is held the weekend closest to Bella’s birthday,
  September 13. For 2026 it listed September 10–13.

  The Seattle Times, writing fifteen years after the first film, says
  almost the entire book is set on the Olympic Peninsula — and that not
  a single shot of the first Twilight movie was filmed in Forks. The
  paper says the 2007 production was shot mostly around Portland, with
  only two major Washington scenes: the exterior of “Forks High School”
  at Kalama High School, and the Cullens’ backyard at Cape Horn. In
  2007 Forks had just over 10,000 visitors. In 2009, after the movie,
  the Times says that figure rose to 70,000.

  The pin is the real Forks. The cameras mostly went to Oregon. The
  fans still come here.
