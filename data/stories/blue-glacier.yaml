slug: blue-glacier
title: Blue Glacier
hook: Olympic's largest glacier has receded more than a third of a mile and lost more than 150 feet of ice thickness since 1919.
body: |
  Blue Glacier sits on Mount Olympus, the highest point on the Olympic
  Peninsula at 7,980 feet (2,432 meters). NPS calls Blue Glacier the
  park's largest glacier. Since 1919 it has receded over one-third of
  a mile and lost more than 150 feet of ice thickness.

  The surface area of all glacial ice in Olympic National Park
  decreased 46 percent between 1982 and 2015. NPS says warmer winters
  mean some precipitation that used to fall as snow — feeding glaciers
  — now falls as rain.

  Mount Olympus is estimated to get over 50 feet (18 meters) of snow.
  The Hoh Rain Forest, on the glacier's west-side drainage, records an
  average of almost 12 feet (3.6 meters) of rain a year. The sources
  below are Olympic National Park weather pages.
