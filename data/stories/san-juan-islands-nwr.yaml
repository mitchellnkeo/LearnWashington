slug: san-juan-islands-nwr
title: San Juan Islands National Wildlife Refuge
hook: FWS set these rocks, reefs, and islands aside in 1960 for migratory birds. Almost all of them are closed, with a 200-yard buffer for boats.
body: |
  San Juan Islands National Wildlife Refuge was established in 1960.
  In 1975 it was consolidated with Smith Island National Wildlife Refuge
  (1914), Matia Island National Wildlife Refuge (1937), and Jones Island
  National Wildlife Refuge (1937). FWS says the purpose is to manage
  migratory birds under international treaties and the Migratory Bird
  Conservation Act.

  Except for public-use areas on Matia and Turn Islands, the refuge is
  closed. Surrounding waters within 200 yards are closed to watercraft.
  Black oystercatchers, double-crested and pelagic cormorants, rhinoceros
  auklets, and pigeon guillemots nest on the islands. Harbor and elephant
  seals use the shorelines.

  The complex is managed from Dungeness National Wildlife Refuge. The
  source below is the U.S. Fish and Wildlife Service refuge page.
