slug: paradise-mount-rainier
title: Paradise
hook: Martha Longmire called this 5,400-foot meadow a paradise, and the park still measures about 640 inches of snow here in an average winter.
body: |
  Paradise sits at 5,400 feet on the south side of Mount Rainier. When
  James Longmire's daughter-in-law, Martha, first saw the site, she
  exclaimed, "Oh, what a paradise!" The National Park Service keeps that
  name. The Henry M. Jackson Memorial Visitor Center is in the upper
  parking area. Paradise is 19 miles (30 km) east of the Nisqually
  Entrance and 12 miles (19 km) east of Longmire.

  It is the park's main winter-use area, receiving on average 640 inches
  (53.6 feet / 16.2 meters) of snow a year. The road between Longmire
  and Paradise is plowed in winter but closes at night. Summer trails
  climb through fragile subalpine meadows. The Skyline Trail, 5.5 miles
  (8.8 km), is the essential Paradise loop, with views of Rainier, the
  Tatoosh Range, and on clear days Mount Adams and Mount St. Helens.

  Snow can linger on the trails well into June or July. Pets are not
  allowed on any trails. The sources below are Mount Rainier National
  Park visitor pages.
