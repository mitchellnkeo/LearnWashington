slug: stehekin
title: Stehekin
hook: A roadless village at the head of Lake Chelan takes its name from Salishan words NPS translates as "the way through," "turning around place," or "mountain tops."
body: |
  Stehekin sits at the headwaters of Lake Chelan. NPS says the name is
  based on a Salishan word meaning "the way through" or "turning around
  place" in Lushootseed and "mountain tops" in nxa'amxcin. There are no
  roads to the village. Access is by foot, boat, or plane.

  The village is the hub for Lake Chelan National Recreation Area. NPS
  lists that unit at 61,949 acres on the Stehekin visit page. From here
  trails climb into the North Cascades, and the lake itself is the usual
  way back to Chelan.

  Stehekin is a working community at the end of a long glacial lake, not
  a drive-up overlook. The source below is the National Park Service
  Stehekin page.
