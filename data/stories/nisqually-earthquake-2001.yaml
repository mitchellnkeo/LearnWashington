slug: nisqually-earthquake-2001
title: 2001 Nisqually Earthquake
hook: A deep magnitude 6.8 shock under Puget Sound injured about 400 people and forced a disaster declaration covering 24 counties.
body: |
  The Nisqually earthquake (Mw = 6.8) occurred in the Puget Sound area of
  western Washington on February 28, 2001. The USGS National Strong-Motion
  Program records the origin time as 18:54 UTC (10:54 AM PST). USGS Open-File
  Report 02-346 lists the epicenter as 47.149° N, 122.727° W, at a depth of
  52 km. USGS says the event was similar in mechanism to the April 13, 1949,
  Puget Sound earthquake (Mw = 7.1) and the April 29, 1965, Seattle
  earthquake (Mw = 6.7).

  The shock produced strong shaking over a wide area and damaged Olympia,
  Seattle, and Tacoma. In all, 24 counties and 25 Indian reservations were
  included in a Presidential Disaster Declaration issued March 1, 2001.
  One fatality is attributable to the earthquake and 400 persons sustained
  injuries. Liquefaction was widespread in parts of Olympia and South
  Seattle, and several significant lateral spreads, embankment slides, and
  landslides occurred.

  USGS Open-File Report 02-346 assigned traditional USGS MMI 8 to the Sodo
  area of Seattle. At the lowest intensities the earthquake was felt over
  approximately 350,000 square km (approximately 135,000 square miles) in
  Washington, Oregon, Idaho, Montana, and southern British Columbia.
