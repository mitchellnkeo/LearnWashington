slug: columbia-nwr
title: Columbia National Wildlife Refuge
hook: Ice Age floods tore coulees through this desert. Irrigation seepage later filled the holes, and a 1944 refuge now winters ducks, geese, and sandhill cranes.
body: |
  Columbia National Wildlife Refuge covers nearly 30,000 acres of cliffs,
  canyons, lakes, grasslands, and sagebrush in eastern Washington. FWS
  says that in its natural state almost all of the refuge would be
  shrub-steppe desert, except for the once-ephemeral Crab Creek.

  Ice Age floods gouged the Drumheller Channeled Scablands National
  Natural Landmark here. The Columbia Basin Project later brought
  irrigation water to the desert. Seepage created wetlands, riparian
  habitat, and small lakes. Crab Creek became perennial. The refuge was
  created in 1944 "for migratory birds and other wildlife" as mitigation
  for the project.

  Mild winters and nearby irrigated croplands attract migrating and
  wintering mallards, Canada geese, tundra swans, and other waterfowl.
  Lesser sandhill cranes now concentrate by the thousands for several
  weeks in late winter and early spring, a gathering FWS says began in
  earnest in the late 1980s when leftover grain became an important
  food. The sources below are the U.S. Fish and Wildlife Service refuge
  pages.
