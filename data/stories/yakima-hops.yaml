slug: yakima-hops
title: Yakima Valley Hops
hook: USDA says Washington grows 71 percent of the nation's hops, and Yakima County alone had 32,488 acres in 2022.
body: |
  The U.S. Department of Agriculture's Foreign Agricultural Service
  reported in 2023 that Washington grows 71 percent of U.S. hops, Idaho
  16 percent, and Oregon 13 percent. Those three states grow 98 percent
  of the country's hops. USDA calls the Yakima Valley the heartland of
  that crop.

  The National Agricultural Statistics Service 2022 Census of Agriculture
  listed 32,488 acres of hops in Yakima County. The photograph is a 1941
  Farm Security Administration picture of hop pickers in Yakima County,
  made by Russell Lee.

  Hops here are a field crop with a long paper trail, not a slogan. The
  sources below are USDA and the Library of Congress.
