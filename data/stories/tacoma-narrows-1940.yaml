slug: tacoma-narrows-1940
title: Tacoma Narrows Bridge, 1940
hook: Galloping Gertie opened in July 1940 as the third-longest suspension span in the world. It tore itself apart in the wind four months later.
body: |
  The first Tacoma Narrows Bridge opened to traffic in July 1940. FHWA
  says it was a three-span suspension bridge. The main span was 2,800
  feet (853.4 m) and the total length was 5,939 feet (1,810.2 m), the
  third-longest suspension span in the world at the time.

  On November 7, 1940, only four months after opening, the deck
  oscillated in a twisting motion. FHWA attributes the motion to
  resonance from vortex shedding and aeroelastic flutter. Several
  suspenders in the main span ruptured and the bridge collapsed. The
  way it twisted and heaved earned the nickname Galloping Gertie.

  The Public Roads Administration joined other experts in research that
  improved later suspension bridges, including the Mackinac and
  Verrazzano-Narrows Bridges. FHWA later wrote that the only fatality
  was a cocker spaniel named Tubby. The sources below are Federal
  Highway Administration history pages.
