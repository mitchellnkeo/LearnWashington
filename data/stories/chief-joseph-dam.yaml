slug: chief-joseph-dam
title: Chief Joseph Dam
hook: The Corps calls this the second-leading hydropower producer in the United States, a 27-unit dam at Bridgeport that backs up 51-mile Rufus Woods Lake.
body: |
  Chief Joseph Dam stands on the Columbia River at river mile 545 in
  Bridgeport. Congress first authorized it as Foster Creek Dam in the
  River and Harbor Act of 1946, then renamed it Chief Joseph Dam in 1948.
  Construction began in 1949. Units 1–8 came online in 1955, units 9–16
  in 1958, and units 17–27 in 1979.

  The dam is 236 feet high and 5,962 feet long. The powerhouse is
  2,039 feet long. Twenty-seven units produce 2,607 megawatts. The
  reservoir, Rufus Woods Lake, extends 51 miles upstream. The Corps
  calls the project the second-leading hydropower producer in the
  United States, generating about $450 million a year, with about
  80 percent of the power going to the Everett area.

  The sources below are the Corps Northwestern Division fact sheet.
