slug: umatilla-nwr
title: Umatilla National Wildlife Refuge
hook: 23,555 acres on both shores of the Columbia — three units in Washington — created after John Day Dam flooded the river.
body: |
  Umatilla National Wildlife Refuge is a network of lands on the Oregon
  and Washington shores of the Columbia River. FWS says the refuge
  covers 23,555 acres in five units — three in Washington and two in
  Oregon. Natural and managed wetlands mix with native shrub-steppe.

  The refuge was established in 1969 under the Fish and Wildlife
  Coordination Act, after authorization of John Day Lock and Dam. FWS
  says rivers transformed by large dams become deep, slow lakes, and
  the Coordination Act requires consultation to prevent loss of
  wildlife. Umatilla was created as a consequence of those
  requirements.

  Providing waterfowl habitat is a major focus. In spring, burrowing
  owls and long-billed curlews nest. Summers often exceed 100 degrees.
  In winter, thousands of waterfowl return. Most refuge islands are
  closed to public entry year-round. The sources below are U.S. Fish
  and Wildlife Service pages.
