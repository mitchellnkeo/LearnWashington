slug: marbled-murrelet
title: Marbled Murrelet
hook: A robin-sized seabird that fishes the nearshore and nests up to 53 miles inland on mossy old-growth limbs.
body: |
  The marbled murrelet is a small Pacific alcid about 10 inches long.
  The U.S. Fish and Wildlife Service says the birds spend most of their
  time on the ocean, foraging in nearshore waters usually within 1.2
  to 3 miles of shore and typically less than 100 feet deep. They come
  inland to nest.

  They do not build nests. A single egg is laid on a mat of moss,
  lichen, or debris on a large branch or deformity. Nest stands are
  old-growth forests with large trees and multiple canopy layers.
  In Washington, nests have been found as far as 53 miles inland from
  marine waters.

  The Washington, Oregon, and California population was listed as
  threatened under the Endangered Species Act on October 1, 1992
  (57 FR 45328). FWS says the listed population has continued a
  long-term downward trend since listing. The sources below are U.S.
  Fish and Wildlife Service pages.
