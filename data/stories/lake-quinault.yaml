slug: lake-quinault
title: Lake Quinault
hook: Olympic's west-side valleys take more than 12 feet of rain a year, and Quinault's north shore is in the park while the south shore is National Forest.
body: |
  NPS says Olympic's west-side valleys are drenched in more than 12 feet
  of rain a year and hold North America's best remaining examples of
  temperate rain forest. Giant western hemlock, Douglas-fir, and Sitka
  spruce dominate. Ferns and moss cloak the trees and the forest floor.

  Lake Quinault's north shore lies within Olympic National Park. The
  south shore is managed by Olympic National Forest. From the Quinault
  Rain Forest Ranger Station, Maple Glade is a flat 0.5-mile loop
  through a mossy bigleaf maple grove. The Kestner Homestead trail is a
  flat 1.3-mile loop. North Fork Campground has 9 sites. Graves Creek
  Campground has about 30.

  The Seattle Press Expedition left Port Angeles in December 1889 and
  emerged at Lake Quinault six months later. NPS records that Klallam
  elders recall a grandmother taking her children across the mountains
  to visit relatives near Quinault. Kalaloch is about 35 miles away.
  The sources below are Olympic National Park pages.
