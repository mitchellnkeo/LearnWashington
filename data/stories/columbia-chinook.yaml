slug: columbia-chinook
title: Columbia River Chinook
hook: Chinook are the largest Pacific salmon. NOAA lists several Columbia River populations as threatened or endangered, and they are primary prey for Southern Resident killer whales.
body: |
  Chinook salmon, Oncorhynchus tshawytscha, are also called king salmon.
  NOAA Fisheries says they are the largest of the Pacific salmon. They
  can grow as long as 4.9 feet and up to 129 pounds, though typical
  mature fish are about 3 feet and 30 pounds. They hatch in freshwater,
  feed in the ocean, and return to natal streams to spawn.

  Several Columbia basin populations are protected under the Endangered
  Species Act. NOAA lists Lower Columbia River Chinook as threatened
  (May 24, 1999) and Upper Columbia River spring-run Chinook as
  endangered (March 24, 1999). Snake River fall-run Chinook are also
  listed as threatened. NOAA says salmon are primary prey for Southern
  Resident killer whales.

  This card stays with NOAA's Columbia and West Coast record. The
  sources below are NOAA Fisheries species and listing pages.
