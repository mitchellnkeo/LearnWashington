slug: olympic-mountain-goats
title: Olympic Mountain Goats
hook: Twelve mountain goats released near Lake Crescent in the 1920s were not native — and by 2018 the Olympic herd had grown to about 725.
body: |
  Mountain goats are not native to the Olympic Mountains. NPS says a
  sportsman's group introduced twelve goats in the 1920s, before the
  park was established in 1938. A park FAQ places the releases near
  Lake Crescent from 1925 to 1929. The population later grew to more
  than 1,000 and colonized the entire range.

  Goats damaged alpine soils and rare plants. They also sought salt
  that does not exist in the Olympics but is often present in human
  urine. In 2010 a park visitor was fatally gored while hiking.
  Between 1981 and 1989 the park removed more than 400 goats. The herd
  rose again to about 725 by 2018.

  A 2018 management plan aimed to remove more than 90 percent of the
  goats. From 2018 to 2020, the Washington Department of Fish and
  Wildlife translocated 325 goats to the Cascade Range, where they are
  native. In all, 548 goats were removed in the active phase, which
  ended in 2022. More than 59 percent of those animals were
  translocated. The sources below are Olympic National Park pages.
