slug: sol-duc-falls
title: Sol Duc Falls
hook: NPS calls this the most picturesque waterfall in Olympic National Park — and it is only eight-tenths of a mile through old-growth forest.
body: |
  Sol Duc Falls sits at the end of Sol Duc Road in Olympic National Park.
  From the parking lot, the walk through old-growth forest is 0.8 mile
  (1.3 km) one way and relatively level, with about 200 feet of
  elevation gain. NPS calls it perhaps the most picturesque waterfall
  in Olympic.

  The brochure lists an 82-site campground at Sol Duc, an Ancient Groves
  nature trail (0.6-mile loop), and longer climbs to Mink Lake (2.6
  miles, 1,500 feet) and Deer Lake (3.8 miles, 1,700 feet). Lover's Lane
  makes a 6-mile loop linking the resort, campground, and falls. Pets
  and bicycles are not permitted on any trails.

  The concession-operated Sol Duc Hot Springs Resort has three hot
  mineral pools and a swimming pool and is open from late March through
  mid-October. Keep children close at the falls. The sources below are
  Olympic National Park pages.
