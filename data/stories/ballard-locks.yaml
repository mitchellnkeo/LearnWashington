slug: ballard-locks
title: Hiram M. Chittenden Locks
hook: Two concrete chambers in Ballard lift ships between Puget Sound and Seattle's lakes — and pass salmon the other way.
body: |
  The U.S. Army Corps of Engineers finished the Lake Washington Ship Canal
  and Hiram M. Chittenden Locks in 1917. The canal joins Lake Washington,
  Lake Union, and Salmon Bay to the tidal water of Puget Sound. Seattle
  calls them the Ballard Locks, after the neighborhood on the north bank.

  The complex has two locks: a small chamber 30 by 150 feet and a large
  chamber 80 by 825 feet. A 235-foot spillway with six gates holds the
  freshwater lakes above salt water. A fish ladder is built into the
  locks so anadromous fish, especially salmon, can keep migrating.

  The first ship passed on August 3, 1916. The locks were formally opened
  on July 4, 1917. They are named for Maj. Hiram Martin Chittenden, Seattle
  District Engineer from April 1906 to September 1908. The sources below
  are the Corps of Engineers' public record of the project.
