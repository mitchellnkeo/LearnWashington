slug: steigerwald-lake-nwr
title: Steigerwald Lake National Wildlife Refuge
hook: A 1987 refuge just east of Washougal was created to offset lowland habitat lost to Bonneville Dam, then reopened 965 acres of floodplain.
body: |
  Steigerwald Lake National Wildlife Refuge sits just east of Washougal,
  at the western gateway to the Columbia River Gorge National Scenic
  Area. FWS established it in 1987 to offset lowland habitat lost to
  construction at Bonneville Dam, then added smaller parcels over time.

  Those lands were meant to reduce the impact of that loss and provide
  more habitat for migrating and resident wildlife. The refuge now
  offers a trail system through restored habitat.

  The Steigerwald Reconnection Project is a collaborative effort to
  reconfigure the Columbia River levee system to reduce flood risk to
  the neighboring community, reconnect 965 acres of Columbia River
  floodplain, and enhance recreation. The source below is the U.S. Fish
  and Wildlife Service refuge page.
