slug: little-pend-oreille-nwr
title: Little Pend Oreille National Wildlife Refuge
hook: The only mountainous mixed-conifer refuge in the National Wildlife Refuge System rises from 1,800 to 5,600 feet southeast of Colville.
body: |
  Little Pend Oreille National Wildlife Refuge is 13 miles southeast of
  Colville, about 70 miles north of Spokane. FWS says it is the only
  mountainous, mixed-conifer forest refuge in the National Wildlife
  Refuge System. Elevations range from 1,800 to 5,600 feet.

  Six forest zones are present: Douglas fir, grand fir, ponderosa pine,
  western redcedar, western hemlock, and subalpine fir. Habitats also
  include scattered lakes, shallow marshes, ponds and springs, and more
  than 80 miles of streams. The refuge sits in the Columbia River Basin
  and the Okanogan Highlands, on the western edge of the Selkirk
  Mountains.

  It was established to protect migratory birds and other wildlife.
  Large mammals include bear, cougar, deer, elk, and moose. More than
  200 bird species have been recorded. Much of the recent work has
  focused on ponderosa pine habitat that supports flammulated owl,
  white-headed woodpecker, and chipping sparrow. The source below is
  the U.S. Fish and Wildlife Service refuge page.
