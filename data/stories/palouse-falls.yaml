slug: palouse-falls
title: Palouse Falls
hook: A 200-foot drop in a Palouse coulee is the state waterfall, carved when Ice Age floods rerouted a river from the Columbia to the Snake.
body: |
  Palouse Falls State Park sits in the channeled scablands, where Ice Age
  floodwaters carved the Palouse River canyon more than 13,000 years ago.
  NPS says the falls drop 200 feet (61 meters). Below the lip, the river
  zigzags about six miles (9.7 kilometers) through a 300-foot (91-meter)
  coulee.

  The same floods rerouted the ancestral Palouse River from the Columbia
  to the Snake. In 2014 the falls became Washington's official state
  waterfall after a bill that began with schoolchildren. Viewpoints are
  2.3 miles (3.7 kilometers) east of State Route 261.

  The park is a stop on the Ice Age Floods National Geologic Trail. The
  sources below are the National Park Service accounts of the falls and
  the trail brochure.
