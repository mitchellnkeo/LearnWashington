slug: north-cascades-national-park
title: North Cascades National Park
hook: NPS calls this the most heavily glaciated area in the United States outside Alaska, with more than 300 glaciers on the high peaks.
body: |
  North Cascades National Park is the heart of a park-service complex that
  also includes Ross Lake and Lake Chelan National Recreation Areas.
  The NPS glaciers page says the park has more than 300 glaciers and is
  the most heavily glaciated area in the United States outside Alaska.
  Congress established the park in 1968.

  The park foundation document lists North Cascades National Park at
  501,458 acres, Ross Lake National Recreation Area at 116,798 acres, and
  Lake Chelan National Recreation Area at 62,902 acres, with 312 active
  glaciers. An NPS climate brief puts the complex at 681,158 acres, with
  about 42 square miles of glaciers and a 53 percent area loss since 1900.

  The high country is ice, rock, and deep valleys. The sources below are
  the National Park Service record of the glaciers, the foundation
  document, and the climate brief.
