slug: columbia-basin-project
title: Columbia Basin Project
hook: Reclamation's irrigation project now serves about 671,000 acres in east-central Washington, roughly two-thirds of the land Congress authorized in 1943.
body: |
  The Columbia Basin Project serves about 671,000 acres — about
  65 percent of the 1,029,000 acres authorized — in Grant, Lincoln,
  Adams, and Franklin counties, with land in Douglas County on the
  north. Congress authorized the project in 1943. The main works include
  Grand Coulee Dam, Franklin D. Roosevelt Lake, three power plants, and
  a pump-generating plant.

  Primary irrigation works include the Feeder Canal, Banks Lake, the
  Main, West, East High, and East Low canals, O'Sullivan Dam, Potholes
  Reservoir, and Potholes Canal. Reclamation lists over 300 miles of
  main canals, about 2,000 miles of laterals, and 3,500 miles of drains
  and wasteways. The first irrigation water near Pasco reached about
  5,400 acres in 1948. Water from Grand Coulee reached about 66,000 acres
  in spring 1952.

  Irrigators use about 2.5 million acre-feet of Columbia River water a
  year, plus about 1 million acre-feet reused. The source below is the
  Bureau of Reclamation Columbia Basin Project page.
