slug: elwha-river-restoration
title: Elwha River restoration
hook: The largest dam removal in U.S. history gave the Elwha back to salmon — and to the people who lived along it.
body: |
  For millennia the Elwha ran from the Olympic Mountains to the Strait of Juan
  de Fuca. Eleven varieties of salmon and trout spawned in it. Those fish were
  a food source for the Lower Elwha Klallam Tribe living along the banks.

  Two dams went in during the early 1900s to power Port Angeles. The Elwha Dam
  stood 105 feet high at river mile 4.9 and was built in 1910–12. Glines Canyon
  Dam, 210 feet high at river mile 13.5, was built in 1927. Together they
  blocked salmon, trapped sediment, and flooded tribal homelands and cultural
  sites.

  Congress passed the Elwha River Ecosystem and Fisheries Restoration Act in
  1992. After two decades of planning, the largest dam removal in U.S. history
  began on September 17, 2011. Six months later the Elwha Dam was gone. Glines
  Canyon Dam followed in 2014. The river now runs free again from the mountains
  to the strait. The Tribe remains a partner in the restoration that followed.
