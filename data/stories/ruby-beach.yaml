slug: ruby-beach
title: Ruby Beach
hook: Cedar Creek meets the Pacific 7.5 miles north of Kalaloch. About 225,000 people a year walk down to the stacks and tide pools.
body: |
  Ruby Beach is on the southwest coast of the Olympic Peninsula, inside
  Olympic National Park and 7.5 miles north of Kalaloch. At this point
  along the coast, Cedar Creek feeds into the Pacific Ocean. NPS says
  visitors come for geology and tide pools, and to watch for driftwood
  that can cover parts of the beach.

  A trailhead near the parking area leads to the scenic beach. The
  parking area, overlooks, and restrooms are accessible. Pets are
  allowed on a leash. The beach receives approximately 225,000 visitors
  a year.

  In 2022 the parking area and access road closed for three months
  while crews graded and paved the lot, added curbs, sidewalks, and a
  storm drain to reduce bluff erosion, and improved accessibility. The
  contract was $910,985. The sources below are Olympic National Park
  pages.
