slug: nirvana-aberdeen
title: Nirvana in Aberdeen
hook: The city keeps a small park under the Young Street Bridge for the kid who hung out there — then rewrote rock.
body: |
  The City of Aberdeen lists Kurt Cobain Memorial Park as a small
  neighborhood park at the base of the Young Street Bridge, “made famous
  as one of Kurt Cobain’s hangouts while living in Aberdeen.” The city
  says the park includes art statues and signs as a tribute, that it was
  built and maintained by Tori and Marcia Kovach and Denny Jackson, and
  that it was transferred to the city when the Kovaches moved away.

  Washington’s Department of Enterprise Services later wrote about
  Aberdeen residents Lee and Dani Bacon, who bought and restored
  Cobain’s childhood home and in 2024 opened The Music Project, which
  Dani Bacon called an interactive space where visitors can engage with
  music and storytelling. DES calls Aberdeen the “birthplace of grunge”
  in that account.

  The pin is the city’s park on the Wishkah, not a private house. Come
  as you are, and stay on public ground.
