slug: john-day-dam
title: John Day Dam
hook: Sixteen turbine units and a 110-foot lock sit on the Columbia at river mile 215, backing up Lake Umatilla.
body: |
  John Day Dam spans the Columbia River at river mile 215 near Rufus,
  Oregon, with the Washington shore opposite. The U.S. Army Corps of
  Engineers Northwestern Division lists the dam as a Portland District
  storage project authorized for hydropower, navigation, and flood
  control under the 1950 Flood Control Act.

  A Corps photo caption says the navigation lock has one of the highest
  lifts of any U.S. lock — 110 feet — and that the reservoir is Lake
  Umatilla. The dam has 16 turbine units.

  John Day is one of the four lower Columbia dams in the Corps inland
  waterway, with Bonneville, The Dalles, and McNary. The sources below
  are U.S. Army Corps of Engineers pages.
