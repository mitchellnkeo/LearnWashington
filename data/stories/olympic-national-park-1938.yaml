slug: olympic-national-park-1938
title: Olympic National Park, 1938
hook: Franklin Roosevelt signed the park into law on June 29, 1938, after a 1937 visit, on ground first reserved in 1897 and later set aside for Roosevelt elk.
body: |
  President Franklin D. Roosevelt signed the act establishing Olympic
  National Park on June 29, 1938. NPS says the enabling language made it
  a public park for the benefit and enjoyment of the people. He had
  visited the Olympics in 1937.

  The ground had an earlier paper trail. President Cleveland created a
  forest reserve in 1897. President Theodore Roosevelt created Mount
  Olympus National Monument in 1909 to protect Roosevelt elk. The
  Pacific coast strip was added to the park in 1953.

  This card is the establishment story. Hurricane Ridge, the Hoh, and
  the coast are the places that came after. The sources below are the
  National Park Service history of the park.
