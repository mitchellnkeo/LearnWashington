claims:
  - text: >
      The City of Seattle says the Harvard-Belmont Landmark District is
      a well-preserved residential neighborhood on the west slope of
      Capitol Hill, built by the city’s leading financiers,
      industrialists, merchants, and businessmen in the early years of
      the twentieth century.
    claimType: factual
    confidence: verified
    sources:
      - seattle-harvard-belmont
  - text: >
      A city historic-districts brochure says the district is a
      14-block, predominantly residential area designated in 1980
      (SMC 25.22) after residents initiated the landmark process.
    claimType: factual
    confidence: verified
    sources:
      - seattle-historic-districts-brochure
      - seattle-harvard-belmont
  - text: >
      The city says railroad builder H. C. Henry was the first man of
      influence to settle in the district, and that during the first
      decade of the twentieth century merchants, bankers, lawyers,
      engineers, lumber barons, and other entrepreneurs built
      residences along Harvard Avenue East, Belmont Place East, and
      neighboring streets.
    claimType: historical
    confidence: verified
    sources:
      - seattle-harvard-belmont
  - text: >
      The city says the 1920s brought the Spanish-style Hacienda
      Apartments, Tudor-influenced Anhalt apartment groups, the Cornish
      School, and the Woman’s Century Club along the southern and
      western boundaries of the district.
    claimType: historical
    confidence: verified
    sources:
      - seattle-harvard-belmont
  - text: >
      USGS Geographic Names lists Capitol Hill, a populated place in
      King County, at 47.62416667° N, 122.32083333° W (GNIS 1512065).
    claimType: factual
    confidence: verified
    sources:
      - usgs-gnis-capitol-hill

