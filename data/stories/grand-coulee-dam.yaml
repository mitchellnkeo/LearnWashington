slug: grand-coulee-dam
title: Grand Coulee Dam
hook: A Depression-era dam turned the Columbia into irrigation, power, and a 151-mile lake.
body: |
  On July 16, 1933, the first stake went in for Grand Coulee Dam. The Bureau of
  Reclamation ran a nine-year Public Works Administration project to build what
  was then the largest structure in the world. The first concrete was poured in
  December 1935. Seventy-seven people died during construction of the original
  dam.

  The first generator entered service on October 4, 1941. The last concrete
  was placed on December 12, 1941, and Reclamation accepted the dam on
  January 1, 1942. Lake Roosevelt now extends 151 miles upstream to the
  Canadian border, with 600 miles of shoreline and 82,000 acres of surface.

  The dam irrigates about 600,000 acres in the Columbia Basin Project, generates
  hydropower, and helps control Columbia River floods. The sources below are
  the Bureau of Reclamation's public construction and project record.
