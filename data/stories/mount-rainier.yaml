claims:
  - text: >
      Mount Rainier is the highest peak in the Cascade Range at 4,392 m
      (14,410 ft), located in Pierce County, Washington, at 46.853° N,
      121.76° W. USGS classifies it as a stratovolcano of andesite to dacite
      with Very High threat potential.
    claimType: factual
    confidence: verified
    sources:
      - usgs-mount-rainier
  - text: >
      The last magmatic eruption was about 1,000 years ago. During an eruption
      5,600 years ago the once-higher edifice collapsed to form a large crater
      open to the northeast; later eruptions rebuilt the summit.
    claimType: scientific
    confidence: verified
    sources:
      - usgs-mount-rainier
  - text: >
      Because of its elevation, hydrothermal alteration, icecap, glacier-fed
      valleys, and proximity to Seattle-Tacoma suburbs, USGS describes Mount
      Rainier as the most threatening volcano in the Cascades. The greatest
      risk is huge lahars, which can be triggered by collapse or magma-water-ice
      interaction rather than by an eruption itself.
    claimType: scientific
    confidence: verified
    sources:
      - usgs-rainier-hazards
  - text: >
      Geologists have found evidence for at least nine large lahars from Mount
      Rainier in the last 5,600 years that reached the Puget Lowlands. The most
      recent large lahar, the Electron Mudflow of about 1500 A.D., was caused
      by a landslide off the west flank with no known eruptive trigger.
    claimType: scientific
    confidence: verified
    sources:
      - usgs-rainier-lahar-monitoring

