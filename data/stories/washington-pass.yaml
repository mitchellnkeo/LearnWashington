slug: washington-pass
title: Washington Pass
hook: A 5,500-foot overlook on the North Cascades Highway looks across Liberty Bell, Early Winters Spires, and Kangaroo Ridge.
body: |
  Washington Pass Observation Site sits on the Okanogan-Wenatchee National
  Forest, 30 miles west of Winthrop on U.S. 20. The Forest Service lists
  the overlook at 48.5265° N, 120.6497° W, elevation 5,500 feet. From the
  parking area the view takes in Liberty Bell Mountain, Early Winters
  Spires, and Kangaroo Ridge.

  NPS describes a paved trail about 400 feet (250 meters) long at the
  overlook. Larches color the slopes in fall. Snow can linger until early
  July. A Northwest Forest Pass is required.

  The pass is one of the easiest high viewpoints on the North Cascades
  Highway when the road is open. The sources below are the Forest Service
  recreation page and the NPS accessibility note for the overlook.
