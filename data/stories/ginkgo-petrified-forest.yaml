slug: ginkgo-petrified-forest
title: Ginkgo Petrified Forest
hook: One of North America's most diverse fossil forests sits above the Columbia at Vantage — and petrified ginkgo turned up here in 1932.
body: |
  Ginkgo Petrified Forest State Park is a registered National Natural
  Landmark on the Ice Age Floods National Geologic Trail. NPS calls it
  one of the most diverse fossil forests in North America, famous for
  rare petrified ginkgo discovered there in 1932. Petrified wood is
  Washington's official state gem.

  The interpretive center displays more than 30 varieties of petrified
  wood, including rare ginkgo. The Trees of Stone Interpretive Trail
  runs 1.25 miles past more than 20 petrified logs in their original
  settings. The Trailside Museum was built by the Civilian Conservation
  Corps in the 1930s. The site has 3 miles of hiking trails in all.

  The state park covers 7,124 acres and 27,000 feet of freshwater
  shoreline on Wanapum Lake. Ice Age floodwaters carved the Columbia
  walls visible from the interpretive center. The sources below are
  National Park Service Ice Age Floods pages.
