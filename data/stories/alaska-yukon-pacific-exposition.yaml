slug: alaska-yukon-pacific-exposition
title: Alaska-Yukon-Pacific Exposition
hook: Seattle's 1909 world's fair on the University of Washington campus drew millions of visitors and later gave Century 21 its golden anniversary to commemorate.
body: |
  The Alaska-Yukon-Pacific Exposition opened on the University of
  Washington campus in 1909. The National Archives' Seattle highlights
  page says the later Century 21 Exposition commemorated the golden
  anniversary of that fair.

  The Library of Congress Meeting of Frontiers project says the
  exposition drew millions of visitors and displayed Pacific Rim
  commodities. The campus plan from 1909 still shapes the central
  University of Washington grounds.

  The photograph is Frank Nowell's official view of the fairgrounds.
  The sources below are the National Archives and the Library of
  Congress.
