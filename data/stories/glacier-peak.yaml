claims:
  - text: >
      Glacier Peak is a dacite stratovolcano in Snohomish County, Washington,
      at 48.112° N, 121.113° W, elevation 3,213 m (10,541 ft). USGS calls it
      the most remote of Washington's five active volcanoes and rates its
      threat potential as Very High.
    claimType: factual
    confidence: verified
    sources:
      - usgs-glacier-peak
  - text: >
      The most recent eruption was about 1,100 years ago. Since the end of
      the last ice age the volcano has erupted multiple times during at least
      six separate episodes. Glacier Peak and Mount St. Helens are the only
      Washington volcanoes that have generated very large explosive eruptions
      in the past 15,000 years.
    claimType: scientific
    confidence: verified
    sources:
      - usgs-glacier-peak
  - text: >
      Lahars are the greatest hazard. The Suiattle, White Chuck, Sauk, and
      Skagit river valleys are at risk. About 13,000 years ago,
      eruption-generated lahars reached the Stillaguamish valley at Arlington,
      more than 95 km (60 mi) downstream, and deposited more than 2 m (7 ft)
      of sediment.
    claimType: scientific
    confidence: verified
    sources:
      - usgs-glacier-peak-lahars

