slug: puget-sound-naval-shipyard
title: Puget Sound Naval Shipyard
hook: The Navy bought 145 acres at Bremerton on September 16, 1891. The yard later became the Navy's nuclear-capable shipyard on Puget Sound.
body: |
  The Navy established a station at Bremerton on September 16, 1891,
  with 145 acres purchased through the work of Lieutenant Ambrose B.
  Wyckoff. Dry Dock 1 opened in 1896. The station became a Navy Yard
  in 1901.

  During World War II, employment peaked at 32,500. The name Puget
  Sound Naval Shipyard dates to November 30, 1945. The yard began
  submarine repair in 1961 and became nuclear-capable in 1965. On
  May 15, 2003, it was consolidated as Puget Sound Naval Shipyard and
  Intermediate Maintenance Facility.

  The yard still occupies the Sinclair Inlet waterfront in Kitsap
  County. The source below is the Navy's public history of the shipyard.
