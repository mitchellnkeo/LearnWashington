services:
  db:
    image: postgis/postgis:16-3.5
    container_name: fwty-postgis
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: fwty
      POSTGRES_PASSWORD: fwty
      POSTGRES_DB: fwty
    volumes:
      - fwty_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fwty -d fwty"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fwty_pgdata:
